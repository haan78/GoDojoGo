services:
  mysql:
    image: mysql:8.0.42
    env_file:
      - ./.env.docker
    container_name: mysql8042
    restart: on-failure
    environment:
      # MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: godojogo
      # optional:
      # MYSQL_USER: appuser
      # MYSQL_PASSWORD: apppass
    ports:
      - ${MYSQL_PORT}:3306
    volumes:
      - mysql_data:/var/lib/mysql
      # init scripts (runs only on first initialization of the data directory)
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    command:
      # server defaults
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_turkish_ci"

volumes:
  mysql_data:
